name: Auto Clean and Update Subscription

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动运行一次
  workflow_dispatch: # 支持在 GitHub 网页后台手动点击运行

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cleaning Script
        env:
          RAW_SUB_URL: ${{ secrets.RAW_SUB_URL }}
        run: |
          node clean.js

      - name: Commit and Push Cleaned Subscription
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clean_sub.txt
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto update clean sub: $(date '+%Y-%m-%d %H:%M:%S')" && git push)
